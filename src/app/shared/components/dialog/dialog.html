<dialog #dialog class="dialog" [attr.aria-labelledby]="headingId" (cancel)="handleCancel($event)">
  <div class="dialog__header">
    <h2 class="dialog__heading" [id]="headingId">{{ heading() }}</h2>
    <button type="button" class="dialog__close" aria-label="Schließen" (click)="requestClose()">
      <span class="dialog__close-icon" aria-hidden="true"></span>
    </button>
  </div>
  <ng-content />
</dialog>
