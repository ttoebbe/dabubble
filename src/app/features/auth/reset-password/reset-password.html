<app-auth-card class="reset__card" heading="Passwort zurücksetzen" (back)="goBack()">
  @switch (linkState()) {
    @case ('ready') {
      <form class="reset" [formRoot]="resetForm">
        <app-input-field [error]="passwordError()">
          <input
            #control
            type="password"
            placeholder="Neues Passwort"
            aria-label="Neues Passwort"
            autocomplete="new-password"
            [formField]="resetForm.password"
          />
        </app-input-field>
        <app-input-field [error]="confirmationError()">
          <input
            #control
            type="password"
            placeholder="Neues Kennwort bestätigen"
            aria-label="Neues Kennwort bestätigen"
            autocomplete="new-password"
            [formField]="resetForm.confirmation"
          />
        </app-input-field>
        <app-button
          class="reset__submit"
          type="submit"
          [disabled]="resetForm().invalid() || resetForm().submitting()"
        >
          Passwort ändern
        </app-button>
      </form>
    }
    @case ('invalid') {
      <div class="reset reset--invalid">
        <p class="reset__message">{{ linkExpired }}</p>
        <a class="reset__link" routerLink="/passwort-vergessen">Neue E-Mail anfordern</a>
      </div>
    }
    @default {
      <p class="reset reset__message" aria-busy="true">Link wird geprüft …</p>
    }
  }
</app-auth-card>
@if (changed()) {
  <app-toast message="Anmelden" />
}
