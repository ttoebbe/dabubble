<section class="login" aria-labelledby="login-heading">
  <div class="login__intro">
    <h1 id="login-heading" class="login__title">Anmeldung</h1>
    <p class="login__text">
      Wir empfehlen dir, die E-Mail-Adresse zu nutzen, die du bei der Arbeit verwendest.
    </p>
  </div>
  <form class="login__form" [formRoot]="loginForm">
    <div class="login__fields">
      <app-input-field icon="mail" [error]="emailError()">
        <input
          #control
          type="email"
          placeholder="beispielname@email.com"
          aria-label="E-Mail-Adresse"
          autocomplete="email"
          [formField]="loginForm.email"
        />
      </app-input-field>
      <app-input-field icon="lock" [error]="passwordError()">
        <input
          #control
          type="password"
          placeholder="Passwort"
          aria-label="Passwort"
          autocomplete="current-password"
          [formField]="loginForm.password"
        />
      </app-input-field>
    </div>
    <a class="login__forgot" routerLink="/passwort-vergessen">Passwort vergessen?</a>
    <div class="login__divider"><span class="login__divider-text">ODER</span></div>
    <button class="login__google" type="button" [disabled]="busy()" (click)="logInWithGoogle()">
      <img ngSrc="img/logos/google-g.svg" alt="" width="38" height="38" />
      Anmelden mit Google
    </button>
    <div class="login__actions">
      <app-button type="submit" [disabled]="loginForm().submitting() || busy()">
        Anmelden
      </app-button>
      <app-button variant="secondary" [disabled]="busy()" (click)="logInAsGuest()">
        Gäste-Login
      </app-button>
    </div>
    <p class="login__error" aria-live="polite">{{ actionError() }}</p>
  </form>
</section>
<div class="login__sign-up">
  <p>Neu bei DABubble?</p>
  <a class="login__sign-up-link" routerLink="/registrieren">Konto erstellen</a>
</div>
