<app-auth-card heading="Wähle deinen Avatar" (back)="back.emit()">
  <form class="avatar" [formRoot]="avatarForm">
    <img class="avatar__preview" [ngSrc]="preview()" alt="" width="168" height="168" priority />
    <p class="avatar__name">{{ name() }}</p>
    <app-avatar-picker class="avatar__picker" [formField]="avatarForm.avatarUrl" />
    <app-button class="avatar__submit" type="submit" [disabled]="avatarForm().invalid()">
      Weiter
    </app-button>
  </form>
</app-auth-card>
