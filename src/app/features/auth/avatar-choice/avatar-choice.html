<app-auth-card heading="Wähle deinen Avatar" (back)="back.emit()">
  <form class="avatar" [formRoot]="avatarForm">
    <img class="avatar__preview" [ngSrc]="preview()" alt="" width="168" height="168" priority />
    <p class="avatar__name">{{ name() }}</p>
    <fieldset class="avatar__options">
      <legend class="avatar__legend">Aus der Liste wählen</legend>
      @for (option of options; track option; let index = $index) {
        <label class="avatar__option">
          <input
            class="avatar__radio"
            type="radio"
            [value]="option"
            [attr.aria-label]="'Avatar ' + (index + 1)"
            [formField]="avatarForm.avatarUrl"
          />
          <img class="avatar__image" [ngSrc]="option" alt="" width="64" height="64" />
        </label>
      }
    </fieldset>
    <app-button class="avatar__submit" type="submit" [disabled]="avatarForm().invalid()">
      Weiter
    </app-button>
  </form>
</app-auth-card>
