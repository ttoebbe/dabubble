<app-auth-card class="forgot__card" heading="Passwort zurücksetzen" (back)="goToLogin()">
  <form class="forgot" [formRoot]="forgotForm">
    <p class="forgot__text">Bitte geben Sie Ihre E-Mail-Adresse ein.</p>
    <div class="forgot__body">
      <app-input-field icon="mail" [error]="emailError()">
        <input
          #control
          type="email"
          placeholder="beispielname@email.com"
          aria-label="E-Mail-Adresse"
          autocomplete="email"
          [formField]="forgotForm.email"
        />
      </app-input-field>
      <p class="forgot__hint">
        Wir senden Ihnen eine E-Mail, über die Sie Ihr Passwort ändern können.
      </p>
      <app-button
        class="forgot__submit"
        type="submit"
        [disabled]="forgotForm().invalid() || forgotForm().submitting()"
      >
        E-Mail senden
      </app-button>
    </div>
  </form>
</app-auth-card>
@if (sent()) {
  <app-toast message="E-Mail gesendet" [withSendIcon]="true" />
}
