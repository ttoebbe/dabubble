<div class="message" [class.message--own]="own()" [class.message--bar]="barShown()">
  @if (author()) {
    <button
      class="message__avatar"
      type="button"
      [attr.aria-label]="'Profil von ' + name()"
      (click)="showProfile()"
    >
      <app-avatar [src]="avatarUrl()" [status]="status()" [size]="70" />
    </button>
  } @else {
    <span class="message__avatar">
      <app-avatar [src]="avatarUrl()" [size]="70" />
    </span>
  }
  <div class="message__body">
    <p class="message__meta">
      @if (author()) {
        <button class="message__name" type="button" (click)="showProfile()">{{ name() }}</button>
      } @else {
        <span class="message__name message__name--static">{{ name() }}</span>
      }
      <span class="message__time">{{ time() }}</span>
    </p>
    <p class="message__bubble">{{ message().text }}</p>
    @if (chips().length) {
      <app-message-reactions
        [chips]="chips()"
        [alignEnd]="own()"
        (toggled)="toggleReaction($event)"
      />
    }
    @if (failed()) {
      <p class="message__error" role="alert">{{ errorText }}</p>
    }
  </div>
  <div class="message__bar">
    <app-reaction-bar [quick]="quick()" [openRight]="own()" (chosen)="toggleReaction($event)" />
  </div>
</div>
