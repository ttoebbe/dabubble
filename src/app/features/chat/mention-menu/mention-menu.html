<ul
  class="menu"
  role="listbox"
  [id]="listId()"
  [attr.aria-label]="char() === '@' ? 'Personen' : 'Channels'"
>
  @for (option of options(); track option.id; let index = $index) {
    <li
      class="menu__option"
      role="option"
      tabindex="-1"
      [id]="optionId(index)"
      [class.menu__option--active]="index === active()"
      [attr.aria-selected]="index === active()"
      (mousedown)="$event.preventDefault()"
      (click)="picked.emit(option)"
      (keydown.enter)="picked.emit(option)"
    >
      @if (option.avatarUrl) {
        <app-avatar [src]="option.avatarUrl" [size]="32" />
      }
      <span class="menu__label">{{ char() }}{{ option.label }}</span>
    </li>
  }
</ul>
