<div class="composer">
  <div class="composer__box">
    <textarea
      #field
      class="composer__field"
      rows="2"
      aria-label="Nachricht"
      aria-autocomplete="list"
      [attr.aria-controls]="menu() ? listId : null"
      [attr.aria-activedescendant]="activeId()"
      [disabled]="disabled()"
      [maxLength]="maxLength"
      [placeholder]="placeholder()"
      [value]="text()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
      (keyup)="syncCaret()"
      (click)="syncCaret()"
      (focus)="focused.set(true)"
      (blur)="focused.set(false)"
    ></textarea>
    @if (menu(); as open) {
      <app-mention-menu
        [listId]="listId"
        [char]="open.char"
        [options]="open.options"
        [active]="active()"
        (picked)="pick($event)"
      />
    }
    <div class="composer__tools">
      <span class="composer__icons">
        <app-emoji-picker [disabled]="disabled()" (picked)="insertEmoji($event)" />
        <button
          class="composer__at"
          type="button"
          aria-label="Person erwähnen"
          [disabled]="disabled()"
          (click)="insertAt()"
        >
          <span class="composer__at-icon" aria-hidden="true"></span>
        </button>
      </span>
      <button
        class="composer__send"
        type="button"
        aria-label="Nachricht senden"
        [disabled]="!canSend()"
        (click)="send()"
      >
        <span class="composer__send-icon" aria-hidden="true"></span>
      </button>
    </div>
  </div>
  <p class="composer__error" role="alert">{{ error() }}</p>
</div>
