<app-workspace-header
  class="workspace__header"
  [showBack]="chatOpen() || threadOpen()"
  (back)="goBack()"
/>
<nav class="workspace__menu" aria-label="Workspace-Menü" [id]="menuId" [inert]="menuCollapsed()">
  <app-workspace-menu
    [channels]="channels()"
    [contacts]="contacts()"
    [activeId]="activeEntryId()"
    (channelSelected)="openChannel($event)"
    (contactSelected)="openDirectMessage($event)"
    (addChannel)="createChannelOpen.set(true)"
    (newMessage)="openNewMessage()"
  />
</nav>
<main class="workspace__chat">
  <router-outlet (activate)="chatOpen.set(true)" (deactivate)="chatOpen.set(false)" />
</main>
<aside class="workspace__thread" aria-label="Thread">
  <router-outlet
    name="thread"
    (activate)="threadOpen.set(true)"
    (deactivate)="threadOpen.set(false)"
  />
</aside>
<app-menu-toggle
  class="workspace__toggle"
  [collapsed]="menuCollapsed()"
  [controls]="menuId"
  (toggled)="toggleMenu()"
/>
<app-create-channel-dialog
  [open]="createChannelOpen()"
  [takenNames]="channelNames()"
  [people]="people()"
  (closed)="createChannelOpen.set(false)"
  [create]="addChannel"
/>
<app-channel-dialog-host (left)="forgetChannel($event)" />
<app-person-profile (messageRequested)="openDirectMessage($event)" />
