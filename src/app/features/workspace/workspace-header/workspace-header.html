@if (showBack()) {
  <button type="button" class="header__back" aria-label="Zurück" (click)="back.emit()">
    <span class="header__back-icon" aria-hidden="true"></span>
  </button>
}
<app-brand class="header__brand" link="/workspace" />
<p class="header__workspace">
  <img
    class="header__workspace-logo"
    ngSrc="img/logos/workspace-logo.svg"
    alt=""
    width="50"
    height="50"
  />
  Devspace
</p>
<app-workspace-search class="header__search" />
<app-profile-menu class="header__profile" />
