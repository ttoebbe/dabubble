<app-dialog heading="Leute hinzufügen" [open]="open()" (closed)="close()">
  <form class="add-members" [formRoot]="membersForm">
    <p class="add-members__channel">
      <span class="add-members__tag"></span>
      {{ channelName() }}
    </p>
    <app-member-picker [formField]="membersForm.memberIds" [people]="people()" />
    <div class="add-members__footer">
      <p class="add-members__error" aria-live="polite">{{ saveError() }}</p>
      <app-button type="submit" [disabled]="membersForm().invalid() || membersForm().submitting()">
        Hinzufügen
      </app-button>
    </div>
  </form>
</app-dialog>
