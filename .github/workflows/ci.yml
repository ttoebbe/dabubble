# Runs on every branch and pull request: format check, lint and production build.
# The same lint and build run again in the deploy workflow before anything is
# uploaded, so a broken commit is caught before it reaches main.

name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      # environment.ts stays out of the repository. The secret FIREBASE_CONFIG holds the web
      # config of the Firebase project as JSON; without it (forks) the empty template is used.
      - name: Write the Firebase config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "${FIREBASE_CONFIG:-}" ]; then
            printf 'export const environment = { firebase: %s };\n' "$FIREBASE_CONFIG" > src/environments/environment.ts
          else
            cp src/environments/environment.example.ts src/environments/environment.ts
          fi

      - name: Lint
        run: npm run lint

      # Defaults to the production configuration, the one that goes online.
      - name: Build
        run: npm run build
