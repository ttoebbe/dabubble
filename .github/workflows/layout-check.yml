# Layout check (template: workflow/layout-check.yml in ttoebbe/dabubble-layout-check).
#
# Builds the app and measures every page in six viewports; fails on horizontal
# overflow, elements leaving their parent, overlapping stacked siblings or a
# missing gutter. Manual only, like the deploy: a check is started on purpose.
# The checker lives in the private repository ttoebbe/dabubble-layout-check and
# is checked out into tools/layout-check/, the path it also has locally. Reading
# that repository needs the secret LAYOUT_CHECK_TOKEN (fine-grained token,
# Contents: read-only, on dabubble-layout-check only). The workspace pages sign in
# as guest, so the build also needs the secret FIREBASE_CONFIG.

name: Layout check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    name: Measure layout invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check the required secret
        env:
          LAYOUT_CHECK_TOKEN: ${{ secrets.LAYOUT_CHECK_TOKEN }}
        run: |
          if [ -z "${LAYOUT_CHECK_TOKEN:-}" ]; then
            echo "::error::LAYOUT_CHECK_TOKEN is not set. Add it under Settings > Secrets and variables > Actions as a repository secret."
            exit 1
          fi

      - name: Check out the app
        uses: actions/checkout@v5

      - name: Check out the layout checker
        uses: actions/checkout@v5
        with:
          repository: ttoebbe/dabubble-layout-check
          token: ${{ secrets.LAYOUT_CHECK_TOKEN }}
          path: tools/layout-check

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      # The workspace pages sign in as guest, so the build needs the real config.
      - name: Write the Firebase config
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -z "${FIREBASE_CONFIG:-}" ]; then
            echo "::error::FIREBASE_CONFIG is not set."
            exit 1
          fi
          printf 'export const environment = { firebase: %s };\n' "$FIREBASE_CONFIG" > src/environments/environment.ts

      - name: Build the app
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/layout-check/requirements.txt

      - name: Install Playwright and Chromium
        run: |
          pip install -r tools/layout-check/requirements.txt
          python -m playwright install --with-deps chromium

      # The report also goes to the job summary, so a red run shows the table
      # without opening the log.
      - name: Run the layout check
        run: python tools/layout-check/check_layout.py --json layout-violations.json

      - name: Keep the raw violations
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: layout-violations
          path: layout-violations.json
